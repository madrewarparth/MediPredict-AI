[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#F6F8F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"
borderColor = "#E2E8F0"
showWidgetBorder = true
baseRadius = "0.6rem"

[server]
headless = true
enableXsrfProtection = true
maxUploadSize = 50

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
